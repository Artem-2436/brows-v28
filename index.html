<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asinhrom Search | Final</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#C5A059', light: '#D4AF37', dark: '#AA8B4B' },
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: { 'gold-glow': '0 4px 20px -2px rgba(197, 160, 89, 0.25)' }
                }
            }
        }
    </script>

    <style>
        body { background-color: #FBFBFA; color: #1a1a1a; }
        
        @keyframes flowOut {
            0% { opacity: 0; transform: translateY(-15px); filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .anim-flow {
            animation: flowOut 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #E5E5E5; border-radius: 10px; }
        
        .loader {
            border: 2px solid #f3f3f3; border-top: 2px solid #C5A059;
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-32 px-4 relative overflow-x-hidden">

    <!-- Логотип -->
    <div class="mb-10 text-center transition-all duration-500" id="logo-container">
        <h1 class="text-4xl font-light tracking-[0.2em] text-gray-800 uppercase">
            Asinhrom <span class="text-gold font-normal">Search</span>
        </h1>
        <p class="text-gray-400 text-sm mt-2 tracking-widest font-light">INTELLIGENT HYBRID SYSTEM</p>
    </div>

    <!-- Поисковая строка -->
    <div class="w-full max-w-2xl relative z-10 group">
        <div class="relative flex items-center">
            <svg class="absolute left-6 w-5 h-5 text-gray-400 group-focus-within:text-gold transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            
            <input 
                type="text" 
                id="searchInput"
                placeholder="Введите запрос..." 
                class="w-full h-16 pl-16 pr-36 bg-white border border-gray-200 rounded-full text-lg text-gray-700 placeholder-gray-300 outline-none transition-all duration-300 focus:border-gold focus:shadow-gold-glow"
            >
            
            <button 
                onclick="performSearch()"
                class="absolute right-2 top-2 bottom-2 px-8 bg-gold hover:bg-gold-dark text-white font-medium rounded-full transition-all duration-300 shadow-sm flex items-center justify-center min-w-[100px]"
            >
                <span id="btnText">Найти</span>
                <div id="btnLoader" class="loader hidden"></div>
            </button>
        </div>
    </div>

    <!-- Контейнер результатов -->
    <div id="resultsContainer" class="w-full max-w-2xl mt-8 pb-20 space-y-4">
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const logoContainer = document.getElementById('logo-container');

        // Сервисы для fallback (показываются ТОЛЬКО если нет результатов)
        const fallbackServices = [
            { name: "Google", url: "https://www.google.com/search?q=", icon: "G" },
            { name: "Yandex", url: "https://yandex.ru/search/?text=", icon: "Я" },
            { name: "Wildberries", url: "https://www.wildberries.ru/catalog/search.aspx?search=", icon: "WB" },
            { name: "YouTube", url: "https://www.youtube.com/results?search_query=", icon: "▶" },
            { name: "Ozon", url: "https://www.ozon.ru/search/?text=", icon: "Oz" },
            { name: "DuckDuckGo", url: "https://duckduckgo.com/?q=", icon: "🔍" }
        ];

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // UI Start
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            resultsContainer.innerHTML = '';
            logoContainer.style.transform = "scale(0.8)";
            logoContainer.style.opacity = "0.6";

            let foundAnyResults = false;

            try {
                // 1. Пробуем быстрый API (Instant Answer)
                // Используем no_redirect=1 чтобы не тратить время на редиректы
                const apiUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                let items = [];

                // Проверяем Abstract (главный ответ)
                if (data.Abstract && data.AbstractURL) {
                    items.push({
                        title: data.Heading || query,
                        url: data.AbstractURL,
                        desc: data.Abstract,
                        source: "Справка"
                    });
                }

                // Проверяем RelatedTopics (связанные сайты)
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.forEach(topic => {
                        // Прямые темы
                        if (topic.FirstURL && topic.Text) {
                            items.push({
                                title: topic.Text.split(' - ')[0],
                                url: topic.FirstURL,
                                desc: topic.Text,
                                source: "Результат"
                            });
                        } 
                        // Вложенные темы
                        else if (topic.Topics) {
                            topic.Topics.forEach(sub => {
                                if (sub.FirstURL) {
                                    items.push({
                                        title: sub.Text.split(' - ')[0],
                                        url: sub.FirstURL,
                                        desc: sub.Text,
                                        source: "Тема"
                                    });
                                }
                            });
                        }
                    });
                }

                // РЕШАЮЩИЙ МОМЕНТ:
                // Если мы нашли хоть какие-то элементы в API -> Рендерим их как список
                if (items.length > 0) {
                    foundAnyResults = true;
                    renderRealResults(items.slice(0, 10)); // Показываем топ-10
                } 
                
                // 2. Если API вернул пустоту (нет мгновенных ответов), пробуем HTML парсинг
                if (!foundAnyResults) {
                    // Пытаемся загрузить полную выдачу через прокси
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`)}`;
                    
                    try {
                        const deepResp = await fetch(proxyUrl);
                        const deepData = await deepResp.json();
                        
                        if (deepData.contents) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(deepData.contents, 'text/html');
                            const elements = doc.querySelectorAll('.result__body');
                            
                            const deepItems = [];
                            elements.forEach(el => {
                                const titleEl = el.querySelector('.result__a');
                                const snippetEl = el.querySelector('.result__snippet');
                                if (titleEl && snippetEl) {
                                    deepItems.push({
                                        title: titleEl.textContent,
                                        url: titleEl.getAttribute('href'),
                                        desc: snippetEl.textContent,
                                        source: "Веб"
                                    });
                                }
                            });

                            if (deepItems.length > 0) {
                                foundAnyResults = true;
                                renderRealResults(deepItems);
                            }
                        }
                    } catch (e) {
                        console.log("Deep search failed or blocked");
                    }
                }

            } catch (error) {
                console.error("Main error:", error);
                // Ошибку игнорируем, чтобы проверить fallback ниже
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
                
                // 3. FINAL CHECK: Если ничего не нашли ни там, ни там -> Показываем кнопки
                if (!foundAnyResults) {
                    renderFallbackGrid(query);
                }
            }
        }

        // Рендер СПИСКА результатов (Карточки с описанием)
        function renderRealResults(items) {
            resultsContainer.className = "w-full max-w-2xl mt-8 pb-20 space-y-4";
            resultsContainer.innerHTML = '';
            
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `
                    anim-flow 
                    bg-white border border-gold/30 hover:border-gold 
                    rounded-xl p-5 
                    transition-all duration-300 hover:shadow-gold-glow hover:-translate-y-1
                    flex flex-col md:flex-row md:items-start justify-between gap-3
                `;
                card.style.animationDelay = `${index * 60}ms`;

                let domain = 'Сайт';
                try { domain = new URL(item.url).hostname.replace('www.', ''); } catch(e){}

                card.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] text-gold font-bold tracking-wider uppercase bg-gold/10 px-2 py-0.5 rounded">${item.source}</span>
                            <span class="text-xs text-gray-400 truncate max-w-[150px]">${domain}</span>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800 leading-snug mb-1">
                            <a href="${item.url}" target="_blank" class="hover:text-gold transition-colors">${item.title}</a>
                        </h3>
                        <p class="text-sm text-gray-500 font-light line-clamp-2">${item.desc}</p>
                    </div>
                    <div class="flex-shrink-0 self-end md:self-center">
                        <a href="${item.url}" target="_blank" 
                           class="inline-flex items-center px-5 py-2 border border-gold text-gold hover:bg-gold hover:text-white rounded-lg transition-colors duration-300 text-sm font-medium">
                            Перейти
                        </a>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // Рендер КНОПОК-СЕРВИСОВ (Fallback)
        function renderFallbackGrid(query) {
            resultsContainer.className = "w-full max-w-4xl mt-12 pb-20 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5";
            resultsContainer.innerHTML = '';

            fallbackServices.forEach((service, index) => {
                const finalUrl = `${service.url}${encodeURIComponent(query)}`;
                const card = document.createElement('div');
                card.className = `
                    anim-flow group
                    bg-white border border-gold/30 hover:border-gold 
                    rounded-xl p-5 cursor-pointer
                    transition-all duration-300 hover:shadow-gold-glow hover:-translate-y-1
                    flex items-center gap-4 relative overflow-hidden
                `;
                card.style.animationDelay = `${index * 60}ms`;
                card.onclick = () => window.open(finalUrl, '_blank');

                card.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-br from-gold/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    
                    <div class="w-12 h-12 rounded-full bg-gray-50 border border-gray-100 flex items-center justify-center text-xl font-bold text-gray-700 group-hover:border-gold group-hover:text-gold transition-colors relative z-10">
                        ${service.icon}
                    </div>
                    <div class="relative z-10">
                        <h3 class="text-base font-semibold text-gray-800 group-hover:text-gold transition-colors">${service.name}</h3>
                        <p class="text-xs text-gray-400 mt-0.5">Искать "${query}"</p>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        window.addEventListener('load', () => searchInput.focus());
    </script>
</body>
</html>
